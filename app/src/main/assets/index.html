<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hudies</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-deep:#0b0f1a;
  --bg-mid:#121829;
  --panel:#161d30;
  --panel-2:#1c2438;
  --line:#2a3350;
  --line-soft:#232b45;
  --text:#eef1fb;
  --text-soft:#9aa4c4;
  --text-dim:#6b7494;
  --gold:#e8b95f;
  --gold-bright:#f6cf82;
  --emerald:#3ecf8e;
  --emerald-dim:#1d3a30;
  --ember:#ef6a5f;
  --violet:#8b7bf6;
}

*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%, #1a2340 0%, transparent 40%),
    radial-gradient(circle at 90% 100%, #241a3d 0%, transparent 45%),
    var(--bg-deep);
  font-family:'Inter',sans-serif;
  color:var(--text);
  padding:20px 14px 70px;
}

.app{max-width:640px;margin:0 auto;}

/* Header / player card */
.player-card{
  background:linear-gradient(160deg, var(--panel-2) 0%, var(--panel) 100%);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 20px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  position:relative;
  overflow:hidden;
}
.player-card::before{
  content:"";
  position:absolute; top:-40%; right:-20%;
  width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(232,185,95,0.14) 0%, transparent 70%);
  pointer-events:none;
}
.title-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.title{
  font-family:'Playfair Display',serif;
  font-weight:800;
  font-size:1.7rem;
  letter-spacing:0.01em;
  color:var(--text);
  margin:0;
  display:flex; align-items:center; gap:9px;
}
.title .crown{
  font-size:1.1rem;
  font-family:'Inter',sans-serif;
  font-weight:800;
  color:#0b0f1a;
  background:linear-gradient(135deg, var(--gold-bright), var(--gold));
  width:30px; height:30px;
  border-radius:9px;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:0 4px 12px rgba(232,185,95,0.35);
}
.level-badge{
  font-weight:700;
  font-size:0.85rem;
  color:#1a1408;
  background:linear-gradient(135deg, var(--gold-bright), var(--gold));
  padding:6px 14px;
  border-radius:20px;
  white-space:nowrap;
  box-shadow:0 4px 14px rgba(232,185,95,0.35);
}
.xp-row{margin-top:16px; position:relative; z-index:1;}
.xp-label{
  display:flex; justify-content:space-between;
  font-size:0.8rem; color:var(--text-soft); margin-bottom:6px; font-weight:500;
}
.bar-track{
  height:11px; background:#0e1424; border-radius:8px; overflow:hidden;
  border:1px solid var(--line-soft);
}
.bar-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%);
  border-radius:8px;
  transition:width 0.5s ease;
  box-shadow:0 0 12px rgba(232,185,95,0.5);
}
.streak-row{
  margin-top:14px; display:flex; align-items:center; gap:8px;
  font-size:0.86rem; color:var(--text-soft); font-weight:500;
  position:relative; z-index:1;
}
.streak-flame{font-size:1.1rem;}

/* Add subject */
.add-subject-form{
  margin-top:18px;
  display:flex; gap:8px;
  position:relative; z-index:1;
}
.add-subject-form input{flex:1; min-width:0;}

input[type=text]{
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0e1424;
  color:var(--text);
}
input[type=text]::placeholder{color:var(--text-dim);}
input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px;}

button{
  font-family:'Inter',sans-serif;
  cursor:pointer;
  border:none;
  border-radius:10px;
  font-size:0.88rem;
  font-weight:600;
  padding:10px 16px;
  background:linear-gradient(135deg, var(--emerald), #2fae76);
  color:#08150f;
  transition:transform 0.12s ease, filter 0.12s ease;
  white-space:nowrap;
}
button:hover{filter:brightness(1.08);}
button:active{transform:scale(0.96);}
button.ghost{
  background:transparent; color:var(--text-soft);
  border:1px solid var(--line);
}
button.ghost:hover{background:rgba(255,255,255,0.04);}
button.danger{background:transparent; color:var(--ember); padding:5px 9px; font-size:0.85rem; font-weight:400;}
button.danger:hover{background:rgba(239,106,95,0.12);}
button.small{padding:6px 11px; font-size:0.8rem;}
button.gold{background:linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#1a1408;}

/* Realms (subjects) */
.realms{margin-top:22px; display:flex; flex-direction:column; gap:14px;}

.realm{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 10px 26px rgba(0,0,0,0.35);
  overflow:hidden;
}
.realm-header{
  padding:16px 18px;
  display:flex; align-items:center; gap:11px;
  cursor:pointer;
  border-bottom:1px solid transparent;
}
.realm-header.open{border-bottom-color:var(--line-soft);}
.realm-icon{font-size:1.15rem; flex-shrink:0;}
.realm-caret{
  font-size:0.7rem; color:var(--text-dim);
  transition:transform 0.2s ease;
  flex-shrink:0;
}
.realm-caret.open{transform:rotate(90deg);}
.realm-name{
  font-weight:700; font-size:1.05rem;
  flex:1; min-width:0;
  background:transparent; border:none; color:var(--text);
  padding:2px 4px; border-radius:6px;
}
.realm-name{cursor:pointer;}
.realm-name:not([readonly]){cursor:text;}
.realm-name:focus{outline:1px solid var(--gold); background:#0e1424;}
.rename-btn{
  flex-shrink:0; background:transparent; border:none; color:var(--text-dim);
  font-size:0.9rem; padding:4px 6px; border-radius:6px;
}
.rename-btn:hover{background:rgba(255,255,255,0.06); color:var(--text-soft);}
.realm-progress-pct{
  font-size:0.78rem; color:var(--text-soft); white-space:nowrap; font-weight:600;
}
.realm-body{padding:2px 18px 16px;}

.realm-bar-track{
  height:6px; background:#0e1424; border-radius:6px; overflow:hidden; margin:0 18px 12px;
}
.realm-bar-fill{height:100%; background:linear-gradient(90deg, var(--emerald), #2fae76); border-radius:6px; transition:width 0.4s ease;}

/* Chapters */
.chapter{
  border-top:1px dashed var(--line-soft);
  padding:12px 0;
}
.chapter:first-child{border-top:none;}
.chapter-header{
  display:flex; align-items:center; gap:9px; cursor:pointer;
}
.chapter-icon{font-size:0.95rem; flex-shrink:0;}
.chapter-caret{font-size:0.65rem; color:var(--text-dim); transition:transform 0.2s ease;}
.chapter-caret.open{transform:rotate(90deg);}
.chapter-name{
  font-weight:600; font-size:0.93rem; flex:1; min-width:0;
  background:transparent; border:none; color:var(--text);
  padding:2px 4px; border-radius:6px;
}
.chapter-name{cursor:pointer;}
.chapter-name:not([readonly]){cursor:text;}
.chapter-name:focus{outline:1px solid var(--gold); background:#0e1424;}
.chapter-pct{font-size:0.74rem; color:var(--text-soft); font-weight:600;}
.chapter-bar-track{height:5px; background:#0e1424; border-radius:5px; margin:8px 0 9px 23px; overflow:hidden;}
.chapter-bar-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:5px; transition:width 0.4s ease;}

.topics{margin-left:23px; display:flex; flex-direction:column; gap:7px;}
.topic{
  display:flex; align-items:center; gap:9px;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--line-soft);
  border-radius:10px;
  padding:8px 10px;
}
.topic.done{background:rgba(62,207,142,0.09); border-color:rgba(62,207,142,0.3);}
.topic input[type=checkbox]{
  width:18px; height:18px; accent-color:var(--emerald); flex-shrink:0;
}
.topic-name{
  flex:1; min-width:0; font-size:0.88rem;
  background:transparent; border:none; color:var(--text);
  padding:2px 3px; border-radius:5px;
}
.topic.done .topic-name{text-decoration:line-through; color:var(--text-dim);}
.topic-name:focus{outline:1px solid var(--gold);}

.add-row{display:flex; gap:7px; margin-top:10px; margin-left:23px;}
.add-row.chapter-add-row{margin-left:0;}
.add-row input{flex:1; min-width:0; font-size:0.85rem; padding:7px 10px;}

.realm-actions{
  display:flex; justify-content:flex-start; align-items:center;
  margin-top:6px; padding-top:12px; border-top:1px dashed var(--line-soft);
}

/* Empty state */
.empty-state{
  text-align:center; padding:40px 20px;
  color:var(--text-dim);
}
.empty-state .scroll-icon{font-size:2.4rem; margin-bottom:10px;}
.empty-state p{margin:4px 0; font-size:0.92rem;}

/* Floating XP toast */
.xp-toast{
  position:fixed; left:50%; top:18%;
  transform:translate(-50%, 0);
  font-weight:800; font-size:1.2rem;
  color:var(--gold-bright);
  text-shadow:0 2px 10px rgba(0,0,0,0.7);
  pointer-events:none;
  animation:floatUp 1.1s ease-out forwards;
  z-index:50;
}
@keyframes floatUp{
  0%{opacity:0; transform:translate(-50%,10px) scale(0.9);}
  15%{opacity:1; transform:translate(-50%,0) scale(1.08);}
  75%{opacity:1;}
  100%{opacity:0; transform:translate(-50%,-40px) scale(1);}
}

/* Level up banner */
.levelup-overlay{
  position:fixed; inset:0; background:rgba(6,9,16,0.72);
  display:flex; align-items:center; justify-content:center;
  z-index:60; animation:fadeIn 0.25s ease;
  backdrop-filter:blur(2px);
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.levelup-card{
  background:linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--gold);
  border-radius:18px; padding:30px 32px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(232,185,95,0.15);
  max-width:280px;
}
.levelup-card .rank{font-size:2.4rem; margin-bottom:8px;}
.levelup-card h2{
  font-family:'Playfair Display',serif; margin:0 0 8px; color:var(--gold-bright); font-size:1.4rem;
}
.levelup-card p{margin:0 0 18px; color:var(--text-soft); font-size:0.9rem;}

.footer-actions{
  margin-top:24px; text-align:center;
}
.footer-actions button{font-size:0.78rem;}

@media (min-width:480px){
  .title{font-size:1.9rem;}
}
</style>
</head>
<body>

<div class="app">
  <div class="player-card">
    <div class="title-row">
      <h1 class="title"><span class="crown">H</span> Hudies</h1>
      <div class="level-badge" id="levelBadge">⭐ Level 1</div>
    </div>
    <div class="xp-row">
      <div class="xp-label">
        <span id="xpLabel">0 / 100 XP</span>
        <span id="totalXpLabel">Total: 0 XP</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="xpBar" style="width:0%"></div></div>
    </div>
    <div class="streak-row">
      <span class="streak-flame">🔥</span>
      <span id="streakLabel">0 day streak — complete a task today to start one</span>
    </div>

    <form class="add-subject-form" id="addSubjectForm">
      <input type="text" id="newSubjectInput" placeholder="✨ Begin a new realm, e.g. Physics" maxlength="60">
      <button type="button" id="addSubjectBtn">➕ Add subject</button>
    </form>
  </div>

  <div class="realms" id="realmsContainer"></div>

  <div class="footer-actions">
    <button class="ghost" id="resetBtn">🗑️ Reset all progress</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'quest-log-data-v2';
  let state = null;
  let saveTimer = null;

  function loadLocalState(){
    try{
      let raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        raw = localStorage.getItem('quest-log-data-v1');
        if(raw){
          localStorage.setItem(STORAGE_KEY, raw);
        }
      }
      return raw ? JSON.parse(raw) : null;
    }catch(e){
      console.error('Local save load failed', e);
      return null;
    }
  }

  function saveLocalState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    }catch(e){
      console.error('Local save failed', e);
      return false;
    }
  }

  const XP_PER_TOPIC = 10;
  const CHAPTER_BONUS = 25;
  const SUBJECT_BONUS = 100;
  const XP_PER_LEVEL = 100;

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  function escapeAttr(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function defaultState(){
    return {
      xp: 0,
      streak: 0,
      lastActiveDate: null,
      subjects: [
        {
          id: uid(),
          name: 'Physics (example — rename or delete me)',
          bonusAwarded: false,
          chapters: [
            {
              id: uid(),
              name: 'Motion in a Straight Line',
              bonusAwarded: false,
              topics: [
                {id: uid(), name: 'Read the chapter once', done: false},
                {id: uid(), name: 'Solve exercise Q1–Q5', done: false},
                {id: uid(), name: 'Redo the numericals you got wrong', done: false}
              ]
            },
            {
              id: uid(),
              name: 'Laws of Motion',
              bonusAwarded: false,
              topics: [
                {id: uid(), name: 'Read the chapter once', done: false},
                {id: uid(), name: 'Solve exercise Q1–Q5', done: false}
              ]
            }
          ]
        }
      ],
      openRealms: {},
      openChapters: {}
    };
  }

  function loadState(){
    state = loadLocalState() || defaultState();
    render();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      saveLocalState();
    }, 100);
  }

  function levelFromXp(xp){
    return Math.floor(xp / XP_PER_LEVEL) + 1;
  }

  function showXpToast(amount, x, y){
    const el = document.createElement('div');
    el.className = 'xp-toast';
    el.textContent = (amount >= 0 ? '+' : '') + amount + ' XP';
    if(typeof x === 'number'){
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 1150);
  }

  function showLevelUp(newLevel){
    const overlay = document.createElement('div');
    overlay.className = 'levelup-overlay';
    overlay.innerHTML = `
      <div class="levelup-card">
        <div class="rank">🏆</div>
        <h2>Level ${newLevel}!</h2>
        <p>Your steady work is paying off. Keep the streak alive.</p>
        <button id="levelUpClose" class="gold">Continue</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#levelUpClose').addEventListener('click', ()=> overlay.remove());
    setTimeout(()=>{ if(document.body.contains(overlay)) overlay.remove(); }, 3200);
  }

  function addXp(amount, evt){
    const beforeLevel = levelFromXp(state.xp);
    state.xp = Math.max(0, state.xp + amount);
    const afterLevel = levelFromXp(state.xp);
    if(amount !== 0){
      let x, y;
      if(evt && evt.clientX){ x = evt.clientX; y = evt.clientY; }
      showXpToast(amount, x, y);
    }
    if(afterLevel > beforeLevel){
      setTimeout(()=> showLevelUp(afterLevel), 300);
    }
  }

  function bumpStreak(){
    const today = todayStr();
    if(state.lastActiveDate === today) return;
    if(state.lastActiveDate){
      const gap = daysBetween(state.lastActiveDate, today);
      state.streak = gap === 1 ? state.streak + 1 : 1;
    } else {
      state.streak = 1;
    }
    state.lastActiveDate = today;
  }

  function chapterStats(chapter){
    const total = chapter.topics.length;
    const done = chapter.topics.filter(t=>t.done).length;
    return {total, done, pct: total ? Math.round(done/total*100) : 0};
  }
  function subjectStats(subject){
    let total = 0, done = 0;
    subject.chapters.forEach(c=>{
      total += c.topics.length;
      done += c.topics.filter(t=>t.done).length;
    });
    return {total, done, pct: total ? Math.round(done/total*100) : 0};
  }

  function toggleTopic(subject, chapter, topic, evt){
    topic.done = !topic.done;
    if(topic.done){
      addXp(XP_PER_TOPIC, evt);
      bumpStreak();
      const cs = chapterStats(chapter);
      if(cs.total > 0 && cs.done === cs.total && !chapter.bonusAwarded){
        chapter.bonusAwarded = true;
        setTimeout(()=> addXp(CHAPTER_BONUS), 250);
      }
      const ss = subjectStats(subject);
      if(ss.total > 0 && ss.done === ss.total && !subject.bonusAwarded){
        subject.bonusAwarded = true;
        setTimeout(()=> addXp(SUBJECT_BONUS), 500);
      }
    } else {
      addXp(-XP_PER_TOPIC);
      if(chapter.bonusAwarded){
        chapter.bonusAwarded = false;
      }
      if(subject.bonusAwarded){
        subject.bonusAwarded = false;
      }
    }
    scheduleSave();
    render();
  }

  function addChapterToSubject(subject){
    const chapter = {
      id: uid(),
      name: 'New chapter',
      bonusAwarded: false,
      topics: []
    };
    subject.chapters.push(chapter);
    state.openChapters[chapter.id] = true;
    scheduleSave();
    render();
  }

  function addTopicToChapter(chapter, name){
    chapter.topics.push({ id: uid(), name: name, done: false });
    scheduleSave();
    render();
  }

  function render(){
    const level = levelFromXp(state.xp);
    const xpIntoLevel = state.xp % XP_PER_LEVEL;
    document.getElementById('levelBadge').textContent = '⭐ Level ' + level;
    document.getElementById('xpLabel').textContent = xpIntoLevel + ' / ' + XP_PER_LEVEL + ' XP';
    document.getElementById('totalXpLabel').textContent = 'Total: ' + state.xp + ' XP';
    document.getElementById('xpBar').style.width = xpIntoLevel + '%';

    const streakLabel = document.getElementById('streakLabel');
    if(state.streak > 0){
      const today = todayStr();
      const studiedToday = state.lastActiveDate === today;
      streakLabel.textContent = state.streak + ' day streak' + (studiedToday ? ' — nice work today' : ' — complete a task today to keep it alive');
    } else {
      streakLabel.textContent = '0 day streak — complete a task today to start one';
    }

    const container = document.getElementById('realmsContainer');
    container.innerHTML = '';

    if(state.subjects.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<div class="scroll-icon">📜</div><p>Your quest map is blank.</p><p>Add a subject above to start charting it.</p>`;
      container.appendChild(empty);
      return;
    }

    state.subjects.forEach(subject=>{
      const ss = subjectStats(subject);
      const isOpen = !!state.openRealms[subject.id];

      const realmEl = document.createElement('div');
      realmEl.className = 'realm';

      const header = document.createElement('div');
      header.className = 'realm-header' + (isOpen ? ' open' : '');
      header.innerHTML = `
        <span class="realm-caret${isOpen ? ' open' : ''}">▶</span>
        <span class="realm-icon">📚</span>
        <input class="realm-name" type="text" value="${escapeAttr(subject.name)}" maxlength="60" readonly>
        <button type="button" class="rename-btn" title="Rename">✎</button>
        <span class="realm-progress-pct">${ss.done}/${ss.total}</span>
      `;
      const realmNameInput = header.querySelector('.realm-name');
      const realmRenameBtn = header.querySelector('.rename-btn');

      realmRenameBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        realmNameInput.removeAttribute('readonly');
        realmNameInput.focus();
        realmNameInput.select();
      });
      realmNameInput.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); realmNameInput.blur(); }
      });
      realmNameInput.addEventListener('blur', (e)=>{
        subject.name = e.target.value.trim() || subject.name;
        e.target.value = subject.name;
        e.target.setAttribute('readonly', '');
        scheduleSave();
        render();
      });
      header.addEventListener('click', (e)=>{
        if(e.target === realmRenameBtn) return;
        if(e.target === realmNameInput && !realmNameInput.hasAttribute('readonly')) return;
        state.openRealms[subject.id] = !isOpen
